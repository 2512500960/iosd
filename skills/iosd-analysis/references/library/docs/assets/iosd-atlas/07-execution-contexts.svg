<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="contexts-title contexts-desc"><title id="contexts-title">07 · Linux 线程 IOS task 与队列协作</title><desc id="contexts-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="contexts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="650" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">07 · Linux 线程 IOS task 与队列协作</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">按已有创建与循环证据解释执行上下文、工作对象和业务回调</text><rect x="24" y="102" width="1072" height="205" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="40" y="130" font-size="17" fill="#142c40" font-weight="500">同一个 iosd Linux 进程内：线程可跨主 ELF 和共享库执行代码</text><rect x="42" y="151" width="228" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="56" y="176" font-size="18" fill="#142c40" font-weight="500">IOS 主线程</text><text class="" x="56" y="199" font-size="15" fill="#142c40" font-weight="400">已有线程被登记</text><rect x="300" y="151" width="244" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="314" y="176" font-size="18" fill="#142c40" font-weight="500">Fastpath / Packet</text><text class="" x="314" y="199" font-size="15" fill="#142c40" font-weight="400">库中事件循环与 I/O 分发</text><rect x="574" y="151" width="244" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="588" y="176" font-size="18" fill="#142c40" font-weight="500">Auxiliary / Sim Aux</text><text class="" x="588" y="199" font-size="15" fill="#142c40" font-weight="400">请求队列、回调、通知</text><rect x="848" y="151" width="230" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="862" y="176" font-size="18" fill="#142c40" font-weight="500">Worker 线程池</text><text class="" x="862" y="199" font-size="15" fill="#142c40" font-weight="400">工作队列 → job 函数</text><rect x="24" y="355" width="516" height="205" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="40" y="383" font-size="17" fill="#142c40" font-weight="500">IOS 内部调度设施</text><rect x="42" y="404" width="480" height="121" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="56" y="429" font-size="18" fill="#142c40" font-weight="500">内部 task 的实例</text><text class="" x="56" y="452" font-size="15" fill="#142c40" font-weight="400">CDP Protocol / EHSA monitor</text><text class="" x="56" y="473" font-size="15" fill="#142c40" font-weight="400">由 IOS 内部调度设施管理</text><rect x="570" y="355" width="526" height="205" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="586" y="383" font-size="17" fill="#142c40" font-weight="500">一个已核对的跨文件协作例子</text><rect x="588" y="404" width="228" height="121" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="602" y="429" font-size="18" fill="#142c40" font-weight="500">so 中 Auxiliary 循环</text><text class="" x="602" y="452" font-size="15" fill="#142c40" font-weight="400">等待请求、取得工作</text><rect x="846" y="404" width="230" height="121" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="860" y="429" font-size="18" fill="#142c40" font-weight="500">主 ELF 接口与回调</text><text class="" x="860" y="452" font-size="15" fill="#142c40" font-weight="400">出队接口与业务代码</text><text class="" x="860" y="473" font-size="15" fill="#142c40" font-weight="400">可在另一个文件中</text><path d="M 816 464.5 L 846 464.5" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#contexts-arrow)"/><text class="" x="24" y="607" font-size="17" fill="#142c40" font-weight="400">内部 task 到当前 Linux TID 的完整映射仍未知；需要现场栈、调度结构或消费记录。</text></g></svg>