<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 588" role="img" aria-labelledby="registration-title registration-desc"><title id="registration-title">04 · 初始化时登记，收到输入时消费</title><desc id="registration-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="registration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="588" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">04 · 初始化时登记，收到输入时消费</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">关系示意；虚线表示函数指针的登记与读取，实际输入按对应接口分发</text><rect x="24" y="105" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="130" font-size="18" fill="#142c40" font-weight="500">功能 init</text><text class="" x="38" y="153" font-size="15" fill="#142c40" font-weight="400">准备状态与登记入口</text><rect x="304" y="105" width="300" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="318" y="130" font-size="18" fill="#142c40" font-weight="500">registry：key → callback</text><text class="" x="318" y="153" font-size="15" fill="#142c40" font-weight="400">保存实现的连接点</text><path d="M 264 148 L 304 148" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)" stroke-dasharray="6 4"/><text class="" x="270" y="135" font-size="13" fill="#526477" font-weight="400">登记</text><rect x="24" y="302" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="327" font-size="18" fill="#142c40" font-weight="500">输入到达</text><text class="" x="38" y="350" font-size="15" fill="#142c40" font-weight="400">报文、CLI、平台事件</text><rect x="304" y="302" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="318" y="327" font-size="18" fill="#142c40" font-weight="500">分发与条件检查</text><text class="" x="318" y="350" font-size="15" fill="#142c40" font-weight="400">选择键、模式或上下文</text><rect x="584" y="302" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="327" font-size="18" fill="#142c40" font-weight="500">被选中的 callback</text><text class="" x="598" y="350" font-size="15" fill="#142c40" font-weight="400">可以处理，也可以先入队</text><path d="M 264 345 L 304 345" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)"/><path d="M 544 345 L 584 345" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)"/><path d="M 454 191 L 424 302" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)" stroke-dasharray="6 4"/><text class="" x="458" y="259" font-size="13" fill="#526477" font-weight="400">读取已绑定入口</text><rect x="584" y="464" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="489" font-size="18" fill="#142c40" font-weight="500">队列（部分机制有）</text><text class="" x="598" y="512" font-size="15" fill="#142c40" font-weight="400">保留待处理对象</text><rect x="864" y="464" width="232" height="86" rx="10" fill="#e6f4ee" stroke="#91bba8"/><text class="" x="878" y="489" font-size="18" fill="#142c40" font-weight="500">消费者 / 状态更新</text><text class="" x="878" y="512" font-size="15" fill="#142c40" font-weight="400">task、事件循环或同步调用</text><path d="M 704 388 L 704 464" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)"/><text class="" x="713" y="433" font-size="13" fill="#526477" font-weight="400">可能入队</text><path d="M 824 507 L 864 507" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#registration-arrow)"/><text class="" x="24" y="494" font-size="17" fill="#142c40" font-weight="400">需要两端证据：谁写入登记，谁查找并调用。</text><text class="" x="24" y="526" font-size="15" fill="#526477" font-weight="400">名字与普通 xref 用于定位登记端和消费端的调查入口。</text></g></svg>