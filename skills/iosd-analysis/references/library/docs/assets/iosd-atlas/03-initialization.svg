<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="init-title init-desc"><title id="init-title">03 · 启动编排分别推进两套初始化机制</title><desc id="init-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="init-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="690" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">03 · 启动编排分别推进两套初始化机制</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">样本局部关系；地址为 RVA；类别与实际初始化顺序分别记录</text><rect x="24" y="102" width="242" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="127" font-size="18" fill="#142c40" font-weight="500">ELF / libc 启动</text><text class="" x="38" y="150" font-size="15" fill="#142c40" font-weight="400">从入口进入 main 包装器</text><text class="detail" x="38" y="193" font-size="13" fill="#526477" font-weight="400">B2463A0 → B246530</text><rect x="304" y="102" width="242" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="318" y="127" font-size="18" fill="#142c40" font-weight="500">运行时代理</text><text class="" x="318" y="150" font-size="15" fill="#142c40" font-weight="400">接收应用回调</text><text class="detail" x="318" y="193" font-size="13" fill="#526477" font-weight="400">__be_pcohort_main_proxy</text><rect x="584" y="102" width="242" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="127" font-size="18" fill="#142c40" font-weight="500">应用回调与系统初始化</text><text class="" x="598" y="150" font-size="15" fill="#142c40" font-weight="400">成功分支准备运行环境</text><text class="detail" x="598" y="193" font-size="13" fill="#526477" font-weight="400">B2464A0 → D7B7690</text><path d="M 266 154 L 304 154" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#init-arrow)"/><path d="M 546 154 L 584 154" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#init-arrow)" stroke-dasharray="6 4"/><text class="" x="550" y="89" font-size="13" fill="#526477" font-weight="400">回调边界</text><rect x="584" y="258" width="242" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="283" font-size="18" fill="#142c40" font-weight="500">元数据发现与整理</text><text class="" x="598" y="306" font-size="15" fill="#142c40" font-weight="400">记录分别交给不同消费者</text><text class="detail" x="598" y="349" font-size="13" fill="#526477" font-weight="400">D710460 / D7127D0</text><path d="M 705 206 L 705 258" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#init-arrow)"/><rect x="154" y="423" width="360" height="110" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="168" y="448" font-size="18" fill="#142c40" font-weight="500">subsystem 机制</text><text class="" x="168" y="471" font-size="15" fill="#142c40" font-weight="400">类别、依赖、Pending → init</text><text class="detail" x="168" y="520" font-size="13" fill="#526477" font-weight="400">D710240 / D711090</text><rect x="598" y="423" width="360" height="110" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="612" y="448" font-size="18" fill="#142c40" font-weight="500">module 机制</text><text class="" x="612" y="471" font-size="15" fill="#142c40" font-weight="400">分组 + 前置依赖 → 回调</text><text class="detail" x="612" y="520" font-size="13" fill="#526477" font-weight="400">D771FA0 / D771350 / D7715A0</text><path d="M 705 362 L 705 393 L 334 393 L 334 423" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#init-arrow)"/><path d="M 705 362 L 705 393 L 778 393 L 778 423" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#init-arrow)"/><text class="" x="154" y="568" font-size="18" fill="#142c40" font-weight="500">5,692 条候选记录；13 类</text><text class="" x="598" y="568" font-size="18" fill="#142c40" font-weight="500">15 个 header；11 条 link</text><text class="" x="154" y="601" font-size="15" fill="#526477" font-weight="400">类别用于安排初始化，init 执行具体准备工作。</text><text class="" x="598" y="601" font-size="15" fill="#526477" font-weight="400">已确认 memtest 归入 level_protocol 分组。</text><text class="" x="24" y="653" font-size="15" fill="#526477" font-weight="400">module 成员关系与 subsystem 分类各按本身的记录确定，并在启动路径中共同推进。</text></g></svg>