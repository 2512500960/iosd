<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" role="img" aria-labelledby="views-title views-desc"><title id="views-title">02 · 四个视角一起解释 iosd</title><desc id="views-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="views-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="624" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">02 · 四个视角一起解释 iosd</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">关系示意；箭头按文字解释，不推断全局包含或调用关系</text><rect x="24" y="94" width="520" height="205" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="40" y="122" font-size="17" fill="#142c40" font-weight="500">文件与进程边界</text><rect x="570" y="94" width="526" height="205" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="586" y="122" font-size="17" fill="#142c40" font-weight="500">初始化组织</text><rect x="42" y="139" width="236" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="56" y="164" font-size="18" fill="#142c40" font-weight="500">iosd 主 ELF</text><text class="" x="56" y="187" font-size="15" fill="#142c40" font-weight="400">协议、CLI、公共设施与元数据</text><rect x="306" y="139" width="220" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="320" y="164" font-size="18" fill="#142c40" font-weight="500">同进程共享库</text><text class="" x="320" y="187" font-size="15" fill="#142c40" font-weight="400">加载边界与实际绑定分别查</text><path d="M 278 189 L 306 189" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#views-arrow)" stroke-dasharray="6 4"/><rect x="588" y="139" width="236" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="602" y="164" font-size="18" fill="#142c40" font-weight="500">subsystem</text><text class="" x="602" y="187" font-size="15" fill="#142c40" font-weight="400">名字、类别、init、属性</text><rect x="850" y="139" width="226" height="100" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="864" y="164" font-size="18" fill="#142c40" font-weight="500">module header / link</text><text class="" x="864" y="187" font-size="15" fill="#142c40" font-weight="400">分组、依赖、回调节点</text><text class="" x="590" y="278" font-size="15" fill="#526477" font-weight="400">两套机制在启动阶段协作，不自动成为父子目录。</text><rect x="24" y="326" width="520" height="215" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="40" y="354" font-size="17" fill="#142c40" font-weight="500">连接与执行设施</text><rect x="42" y="373" width="236" height="102" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="56" y="398" font-size="18" fill="#142c40" font-weight="500">registry / 槽</text><text class="" x="56" y="421" font-size="15" fill="#142c40" font-weight="400">登记入口，分发者以后消费</text><rect x="306" y="373" width="220" height="102" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="320" y="398" font-size="18" fill="#142c40" font-weight="500">队列、task、pthread</text><text class="" x="320" y="421" font-size="15" fill="#142c40" font-weight="400">待处理对象与执行上下文</text><path d="M 278 424 L 306 424" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#views-arrow)" stroke-dasharray="6 4"/><rect x="570" y="326" width="526" height="215" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="586" y="354" font-size="17" fill="#142c40" font-weight="500">业务与状态</text><rect x="588" y="373" width="236" height="102" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="602" y="398" font-size="18" fill="#142c40" font-weight="500">CLI / 报文 / 事件</text><text class="" x="602" y="421" font-size="15" fill="#142c40" font-weight="400">各有入口、解析与条件</text><rect x="850" y="373" width="226" height="102" rx="10" fill="#e6f4ee" stroke="#91bba8"/><text class="" x="864" y="398" font-size="18" fill="