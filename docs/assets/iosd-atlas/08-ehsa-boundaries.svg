<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="ehsa-title ehsa-desc"><title id="ehsa-title">08 · EHSA：检测失联、推进状态、请求切换是不同阶段</title><desc id="ehsa-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="ehsa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="650" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">08 · EHSA：检测失联、推进状态、请求切换是不同阶段</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">样本局部实现；虚线保留跨平台/外部消费端缺口；编号按所属消息或事件空间解释</text><rect x="24" y="111" width="246" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="136" font-size="18" fill="#142c40" font-weight="500">KEEPALIVE 接收</text><text class="" x="38" y="159" font-size="15" fill="#142c40" font-weight="400">类型 30 → 登记回调</text><text class="detail" x="38" y="206" font-size="13" fill="#526477" font-weight="400">D51E0E0 → D512810</text><rect x="316" y="111" width="246" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="330" y="136" font-size="18" fill="#142c40" font-weight="500">刷新监测 / peer monitor</text><text class="" x="330" y="159" font-size="15" fill="#142c40" font-weight="400">定时或计数路径</text><text class="detail" x="330" y="206" font-size="13" fill="#526477" font-weight="400">D511EE0 / D510B80</text><rect x="608" y="111" width="274" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="622" y="136" font-size="18" fill="#142c40" font-weight="500">失联事件过滤与策略</text><text class="" x="622" y="159" font-size="15" fill="#142c40" font-weight="400">raw event 与 FSM major/minor 分</text><text class="" x="622" y="180" font-size="15" fill="#142c40" font-weight="400">别记录</text><text class="detail" x="622" y="206" font-size="13" fill="#526477" font-weight="400">D50F450</text><path d="M 270 165 L 316 165" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#ehsa-arrow)"/><path d="M 562 165 L 608 165" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#ehsa-arrow)"/><text class="" x="571" y="96" font-size="13" fill="#526477" font-weight="400">超时相关分支</text><rect x="608" y="325" width="274" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="622" y="350" font-size="18" fill="#142c40" font-weight="500">FSM 队列与内部 task</text><text class="" x="622" y="373" font-size="15" fill="#142c40" font-weight="400">当前状态 + major/minor → 动作</text><text class="detail" x="622" y="420" font-size="13" fill="#526477" font-weight="400">D519FC0 / D51A800</text><rect x="316" y="325" width="246" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="330" y="350" font-size="18" fill="#142c40" font-weight="500">平台策略回调</text><text class="" x="330" y="373" font-size="15" fill="#142c40" font-weight="400">由平台 init 有条件安装</text><text class="detail" x="330" y="420" font-size="13" fill="#526477" font-weight="400">D52C3A0 / D52D8D0</text><rect x="24" y="325" width="246" height="129" rx="10" fill="#fff3df" stroke="#c9a971" stroke-dasharray="6 4"/><text class="" x="38" y="350" font-size="18" fill="#142c40" font-weight="500">Chasfs / 外部消费者</text><text class="" x="38" y="373" font-size="15" fill="#142c40" font-weight="400">库绑定已有局部证据</text><text class="" x="38" y="394" font-size="15" fill="#142c40" font-weight="400">外部接收与切换结果未闭合</text><path d="M 745 219 L 745 325" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#ehsa-arrow)"/><text class="" x="754" y="280" font-size="13" fill="#526477" font-weight="400">必要时投递事件</text><path d="M 745 219 L 745 270 L 439 270 L 439 325" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#ehsa-arrow)"/><text class="" x="452" y="254" font-size="13" fill="#526477" font-weight="400">过滤器的策略 / 回调分支</text><path d="M 316 379 L 270 389.5" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#ehsa-arrow)" stroke-dasharray="6 4"/><text class="" x="24" y="518" font-size="17" fill="#142c40" font-weight="400">发送路径还经过传输槽与接口输出回调；部分具体运行时目标仍未恢复。</text><text class="" x="24" y="558" font-size="17" fill="#142c40" font-weight="400">发送、监测、事件投递、平台请求和切换完成，各有相应的处理与观测位置。</text><text class="" x="24" y="604" font-size="15" fill="#526477" font-weight="400">平台实现与业务状态机通过回调和事件接口协作，外部消费端继续沿属性或消息查证。</text></g></svg>