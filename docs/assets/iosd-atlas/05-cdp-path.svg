<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="cdp-title cdp-desc"><title id="cdp-title">05 · CDP 接收 队列与内部 task</title><desc id="cdp-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="cdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="660" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">05 · CDP 接收 队列与内部 task</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">样本局部实现；虚线表示登记关系；队列将接收与后续解析连接起来</text><rect x="24" y="103" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="128" font-size="18" fill="#142c40" font-weight="500">CDP 初始化</text><text class="" x="38" y="151" font-size="15" fill="#142c40" font-weight="400">有条件地创建内部 task</text><text class="detail" x="38" y="194" font-size="13" fill="#526477" font-weight="400">CD878F0 / CD894C0</text><rect x="316" y="103" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="330" y="128" font-size="18" fill="#142c40" font-weight="500">CDP Protocol 入口</text><text class="" x="330" y="151" font-size="15" fill="#142c40" font-weight="400">创建队列并登记键 65</text><text class="detail" x="330" y="194" font-size="13" fill="#526477" font-weight="400">CD89F00</text><rect x="24" y="305" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="330" font-size="18" fill="#142c40" font-weight="500">接收回调</text><text class="" x="38" y="353" font-size="15" fill="#142c40" font-weight="400">接口、启用、队列容量检查</text><text class="detail" x="38" y="396" font-size="13" fill="#526477" font-weight="400">CD8AB90</text><rect x="316" y="305" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="330" y="330" font-size="18" fill="#142c40" font-weight="500">CDP packets 队列</text><text class="" x="330" y="353" font-size="15" fill="#142c40" font-weight="400">缓冲待处理报文</text><rect x="608" y="305" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="622" y="330" font-size="18" fill="#142c40" font-weight="500">task 事件循环取包</text><text class="" x="622" y="353" font-size="15" fill="#142c40" font-weight="400">取出报文后再检查上下文</text><text class="detail" x="622" y="396" font-size="13" fill="#526477" font-weight="400">CD89F00 / D789490</text><rect x="608" y="493" width="246" height="104" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="622" y="518" font-size="18" fill="#142c40" font-weight="500">CDP 头 / TLV 检查</text><text class="" x="622" y="541" font-size="15" fill="#142c40" font-weight="400">版本、校验和、长度边界</text><text class="detail" x="622" y="584" font-size="13" fill="#526477" font-weight="400">CD8AF90</text><rect x="874" y="493" width="222" height="104" rx="10" fill="#e6f4ee" stroke="#91bba8"/><text class="" x="888" y="518" font-size="18" fill="#142c40" font-weight="500">邻居与计时状态</text><text class="" x="888" y="541" font-size="15" fill="#142c40" font-weight="400">缓存更新及扩展回调</text><text class="detail" x="888" y="584" font-size="13" fill="#526477" font-weight="400">CD97B10 / CDAB1A0</text><path d="M 270 155 L 316 155" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)"/><path d="M 439 207 L 439 253 L 147 253 L 147 305" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)" stroke-dasharray="6 4"/><text class="" x="197" y="239" font-size="13" fill="#526477" font-weight="400">登记键 65 与 callback</text><path d="M 270 357 L 316 357" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)"/><path d="M 562 357 L 608 357" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)"/><path d="M 731 409 L 731 493" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)"/><path d="M 854 545 L 874 545" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#cdp-arrow)"/><text class="" x="24" y="488" font-size="16" fill="#526477" font-weight="400">前面仍缺：平台入包到该回调的全部消费端。</text><text class="" x="24" y="523" font-size="16" fill="#526477" font-weight="400">后面仍缺：全部扩展 TLV / 后处理回调。</text><text class="" x="24" y="625" font-size="16" fill="#142c40" font-weight="400">另一项 init 回调 CD9AE70 按接口清理邻居记录，与接收路径共同维护邻居状态。</text></g></svg>