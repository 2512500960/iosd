<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 634" role="img" aria-labelledby="configuration-title configuration-desc"><title id="configuration-title">06 · CLI 修改状态，NVGEN 从状态生成文本</title><desc id="configuration-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="configuration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="634" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">06 · CLI 修改状态，NVGEN 从状态生成文本</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">关系示意 + hostname 的已核对案例；共享 handler 不代表所有命令都采用这一结构</text><rect x="24" y="112" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="137" font-size="18" fill="#142c40" font-weight="500">CLI 文本输入</text><text class="" x="38" y="160" font-size="15" fill="#142c40" font-weight="400">关键字与参数</text><rect x="304" y="112" width="240" height="86" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="318" y="137" font-size="18" fill="#142c40" font-weight="500">parser / CSB</text><text class="" x="318" y="160" font-size="15" fill="#142c40" font-weight="400">匹配路径、设置上下文</text><rect x="584" y="112" width="240" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="137" font-size="18" fill="#142c40" font-weight="500">业务 handler 输入分支</text><text class="" x="598" y="160" font-size="15" fill="#142c40" font-weight="400">校验并修改配置状态</text><text class="detail" x="598" y="207" font-size="13" fill="#526477" font-weight="400">hostname: E0E6A00</text><rect x="864" y="112" width="232" height="108" rx="10" fill="#e6f4ee" stroke="#91bba8"/><text class="" x="878" y="137" font-size="18" fill="#142c40" font-weight="500">业务状态对象</text><text class="" x="878" y="160" font-size="15" fill="#142c40" font-weight="400">主机名、接口、协议配置</text><path d="M 264 155 L 304 155" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><path d="M 544 155 L 584 166" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><path d="M 824 166 L 864 166" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><rect x="24" y="334" width="240" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="38" y="359" font-size="18" fill="#142c40" font-weight="500">显示或保存配置</text><text class="" x="38" y="382" font-size="15" fill="#142c40" font-weight="400">创建生成上下文</text><rect x="304" y="334" width="240" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="318" y="359" font-size="18" fill="#142c40" font-weight="500">NVGEN 调度</text><text class="" x="318" y="382" font-size="15" fill="#142c40" font-weight="400">语法、对象迭代与回调</text><text class="detail" x="318" y="429" font-size="13" fill="#526477" font-weight="400">E0DE210 / E39D8F0</text><rect x="584" y="334" width="240" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="598" y="359" font-size="18" fill="#142c40" font-weight="500">业务 handler 生成分支</text><text class="" x="598" y="382" font-size="15" fill="#142c40" font-weight="400">读取相关状态并决定输出</text><text class="detail" x="598" y="429" font-size="13" fill="#526477" font-weight="400">hostname 同一 handler / selector</text><rect x="864" y="334" width="232" height="108" rx="10" fill="#e9f2fa" stroke="#9cb7cc"/><text class="" x="878" y="359" font-size="18" fill="#142c40" font-weight="500">配置文本输出</text><text class="" x="878" y="382" font-size="15" fill="#142c40" font-weight="400">公共输出封装 / 句柄</text><text class="detail" x="878" y="429" font-size="13" fill="#526477" font-weight="400">E0D9CD0 → E0D8B20</text><path d="M 264 388 L 304 388" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><path d="M 544 388 L 584 388" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><path d="M 824 388 L 864 388" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><path d="M 980 220 L 980 278 L 704 278 L 704 334" fill="none" stroke="#526e83" stroke-width="1.8" marker-end="url(#configuration-arrow)"/><text class="" x="755" y="261" font-size="13" fill="#526477" font-weight="400">读取状态；不重放原始命令行</text><text class="" x="24" y="504" font-size="17" fill="#142c40" font-weight="400">接口缓存是有条件的生成优化：资格满足 + 命中 → 复用；否则生成并在相关路径保存。</text><text class="" x="24" y="547" font-size="17" fill="#142c40" font-weight="400">生成文本 ≠ 全部命令定义；默认状态、EXEC、未登记与隐藏路径要分别保留。</text><text class="" x="24" y="590" font-size="15" fill="#526477" font-weight="400">CSB 连接解析上下文，不是装着所有组件配置状态的统一数据库。</text></g></svg>