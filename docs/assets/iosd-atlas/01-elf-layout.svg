<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="elf-title elf-desc"><title id="elf-title">01 · 文件大小、导航元数据与内存不是同一个量</title><desc id="elf-desc">样本 9eccfd46caadfff9c18557e2a446e19b。实线为图中标明的局部关系，虚线含义按图例；未证明的边界保持未知。完整文字解释见对应文档。</desc><defs><marker id="elf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e83"/></marker></defs><rect width="1120" height="590" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text class="" x="24" y="35" font-size="24" fill="#142c40" font-weight="500">01 · 文件大小、导航元数据与内存不是同一个量</text><text class="" x="24" y="64" font-size="15" fill="#526477" font-weight="400">原始 ELF 离线测量；MiB = 1,048,576 字节；尺寸不代表组件或协议数量</text><text class="" x="24" y="108" font-size="20" fill="#142c40" font-weight="500">原始文件  894.85 MiB</text><rect x="24" y="125" width="771.245" height="40" fill="#426f98"/><rect x="24" y="191" width="14" height="14" fill="#426f98"/><text class="" x="48" y="203" font-size="16" fill="#142c40" font-weight="400">可执行节  643.80 MiB</text><rect x="795.245" y="125" width="213.551" height="40" fill="#72a5bf"/><rect x="24" y="221" width="14" height="14" fill="#72a5bf"/><text class="" x="48" y="233" font-size="16" fill="#142c40" font-weight="400">已分配只读数据  178.26 MiB</text><rect x="1008.8" y="125" width="82.587" height="40" fill="#8cbbad"/><rect x="24" y="251" width="14" height="14" fill="#8cbbad"/><text class="" x="48" y="263" font-size="16" fill="#142c40" font-weight="400">已分配可写数据  68.94 MiB</text><rect x="1091.38" y="125" width="3.95176" height="40" fill="#bdc7d2"/><rect x="590" y="191" width="14" height="14" fill="#bdc7d2"/><text class="" x="614" y="203" font-size="16" fill="#142c40" font-weight="400">未分配元数据  3.30 MiB</text><rect x="1095.34" y="125" width="0.664713" height="40" fill="#e4e9ee"/><rect x="590" y="221" width="14" height="14" fill="#e4e9ee"/><text class="" x="614" y="233" font-size="16" fill="#142c40" font-weight="400">头表、对齐等  0.55 MiB</text><rect x="24" y="300" width="520" height="152" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="40" y="328" font-size="17" fill="#142c40" font-weight="500">可执行内容有不同区域和变体</text><text class="" x="40" y="359" font-size="16" fill="#142c40" font-weight="400">.text 311.40 MiB  /  CRPGC_text0 331.81 MiB</text><text class="" x="40" y="390" font-size="16" fill="#142c40" font-weight="400">BGP 有条件进入另一代码区的具体实例。</text><text class="" x="40" y="421" font-size="15" fill="#526477" font-weight="400">不能外推为全节用途或全部函数的对应关系。</text><rect x="570" y="300" width="526" height="152" rx="14" fill="#f5f8fb" stroke="#ccd7df"/><text class="" x="586" y="328" font-size="17" fill="#142c40" font-weight="500">很小的元数据可以成为导航入口</text><text class="" x="586" y="359" font-size="17" fill="#142c40" font-weight="400">subsystem 区 0.52 MiB → 5,692 条记录</text><text class="" x="586" y="390" font-size="16" fill="#142c40" font-weight="400">module header 480 B / link 264 B</text><text class="" x="586" y="421" font-size="15" fill="#526477" font-weight="400">8,866 个 .btrace* 名称节 ≠ 8,866 个业务模块</text><text class="" x="24" y="501" font-size="17" fill="#142c40" font-weight="400">内存另算：NOBITS 没有对应大小的文件载荷；PT_LOAD p_memsz 合计约 1,109.64 MiB。</text><text class="" x="24" y="535" font-size="15" fill="#526477" font-weight="400">不是 RSS，也不包括所有后续堆、栈、共享库；core 缺页不能按 ELF 零初始化规则补齐。</text></g></svg>